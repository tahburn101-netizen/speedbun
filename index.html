<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Bun - Premium Used Cars</title>
<style>
:root{
  --bg:#e8ecf0;
  --bg2:#f5f8fa;
  --text:#1a4d6b;
  --text-muted:#7a9bb0;
  --blue:#5b9bbf;
  --blue-deep:#1a4d6b;
  --blue-light:#a8d4e8;
  --nav-h:60px;
  --accent-red:#c41e3a;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text)}

/* ═══════════════════════════════════════════════════════════
   HERO — 1:1 Reference Match
   Light grey background, brand name small at top, giant model text behind car,
   car large and centered, CTAs and dots at bottom
═══════════════════════════════════════════════════════════ */
.home-hero{
  position:relative;
  height:calc(100vh - var(--nav-h));
  max-height:calc(100vh - var(--nav-h));
  min-height:480px;
  background:var(--bg);
  overflow:hidden;
  perspective:1200px;
}

/* The 3D stage — slides in 3D */
.hero-stage{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
}

/* Each slide */
.hero-slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:none;
}
.hero-slide.current{opacity:1;pointer-events:auto}

/* ═══════════════════════════════════════════════════════════
   HERO TEXT + CAR — CENTERED LAYOUT
   Brand name: small, spaced, mid-grey, at top-center
   Model text: giant, faded, behind the car
   Car: large, centered, on top of text
═══════════════════════════════════════════════════════════ */

/* TEXT BOX — fills hero, centered, behind car */
.hero-text-block{
  position:absolute;
  inset:0;
  z-index:1;
  text-align:center;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* Brand name — small, spaced, at top */
.hero-make{
  display:block;
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(12px,1.8vw,22px);
  font-weight:700;
  letter-spacing:0.42em;
  text-transform:uppercase;
  color:rgba(122,155,176,0.8);
  line-height:1;
  margin-bottom:1.2em;
  overflow:hidden;
  flex-shrink:0;
  position:relative;
  z-index:2;
}
.hero-make-inner{
  display:block;
}
.hero-make-inner.exit-up{animation:textExitUp 0.38s cubic-bezier(0.55,0,1,0.45) forwards}
.hero-make-inner.enter-down{animation:textEnterDown 0.38s cubic-bezier(0,0.55,0.45,1) 0.05s both;opacity:0}

/* MODEL TEXT — giant, faded, centered behind car */
.hero-bg-text{
  display:block;
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(80px,18vw,280px);
  font-weight:900;
  letter-spacing:-0.02em;
  text-transform:uppercase;
  color:rgba(122,155,176,0.15);
  line-height:0.9;
  overflow:hidden;
  white-space:nowrap;
  flex-shrink:0;
  position:relative;
  z-index:1;
}
.hero-bg-text-inner{
  display:inline-block;
  overflow:visible;
}
.hero-bg-text-inner.exit-up{animation:textExitUp 0.42s cubic-bezier(0.55,0,1,0.45) forwards}
.hero-bg-text-inner.enter-down{animation:textEnterDown 0.42s cubic-bezier(0,0.55,0.45,1) 0.05s both;opacity:0}

@keyframes textExitUp{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-120%);opacity:0}
}
@keyframes textEnterDown{
  from{transform:translateY(120%);opacity:0}
  to{transform:translateY(0);opacity:1}
}

/* CAR BOX — large, centered, on top of text */
.hero-car-box{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  overflow:visible;
  padding:80px 60px 120px;
  /* Smooth upward shift when gallery opens */
  transition:padding-bottom 0.45s cubic-bezier(0.77,0,0.18,1);
}
/* When gallery is open, car box shifts up to make room */
.gallery-open .hero-car-box{
  padding-bottom:280px;
}

/* Car image — fills the bounding box */
.hero-car{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center center;
  filter:drop-shadow(0 20px 40px rgba(26,77,107,0.15));
  cursor:pointer;
  pointer-events:auto;
  transition:transform 0.35s cubic-bezier(0.34,1.4,0.64,1);
  transform-origin:center center;
  display:block;
}
.hero-car:hover{
  transform:scale(1.025) translateY(-4px);
}
/* Car slide animations */
.hero-car.slide-in-right{
  animation:carInRight 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
}
.hero-car.slide-in-left{
  animation:carInLeft 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
}
.hero-car.slide-out-left{
  animation:carOutLeft 0.38s cubic-bezier(0.55,0,1,0.45) forwards;
}
.hero-car.slide-out-right{
  animation:carOutRight 0.38s cubic-bezier(0.55,0,1,0.45) forwards;
}
@keyframes carInRight{
  from{transform:translateX(120%) scale(0.9);opacity:0}
  to{transform:translateX(0) scale(1);opacity:1}
}
@keyframes carInLeft{
  from{transform:translateX(-120%) scale(0.9);opacity:0}
  to{transform:translateX(0) scale(1);opacity:1}
}
@keyframes carOutLeft{
  from{transform:translateX(0);opacity:1}
  to{transform:translateX(-120%) scale(0.9);opacity:0}
}
@keyframes carOutRight{
  from{transform:translateX(0);opacity:1}
  to{transform:translateX(120%) scale(0.9);opacity:0}
}

/* Specs panel — hidden by default, slides in from right when car is clicked */
.hero-specs{
  position:absolute;
  right:clamp(14px,3.5vw,48px);
  top:50%;
  transform:translateY(-50%);
  z-index:9;
  text-align:right;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  transition:opacity 0.35s ease, visibility 0.35s ease;
}
.hero-specs.open{
  opacity:1;
  visibility:visible;
}
.spec-item{
  margin-bottom:14px;
  opacity:0;
  transform:translateX(40px);
  transition:opacity 0.4s ease, transform 0.4s ease;
}
.hero-specs.open .spec-item.visible{
  opacity:1;
  transform:translateX(0);
}
.specs-title{
  font-size:9px;font-weight:700;letter-spacing:0.28em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;
  opacity:0;
  transform:translateX(40px);
  transition:opacity 0.3s ease, transform 0.3s ease;
}
.hero-specs.open .specs-title.visible{
  opacity:1;
  transform:translateX(0);
}
.spec-icon{display:none}
.spec-num{
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(16px,2vw,24px);font-weight:900;line-height:1;color:var(--text);
}
.spec-unit{font-size:10px;font-weight:600;color:var(--text-muted)}
.spec-lbl{
  font-size:8px;font-weight:700;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--text-muted);margin-top:1px;
}

/* Arrows */
.h-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  z-index:10;background:none;border:none;
  font-size:36px;color:rgba(122,155,176,0.3);
  cursor:pointer;padding:10px;transition:color 0.2s,transform 0.2s;line-height:1;
}
.h-arrow:hover{color:rgba(122,155,176,0.7);transform:translateY(-50%) scale(1.15)}
.h-prev{left:12px}
.h-next{right:12px}

/* Dots — sit above CTAs */
.h-dots{
  position:absolute;
  bottom:50px;
  left:50%;transform:translateX(-50%);
  z-index:10;display:flex;gap:8px;
  transition:bottom 0.45s cubic-bezier(0.77,0,0.18,1);
}
.gallery-open .h-dots{
  bottom:250px;
}
.h-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(122,155,176,0.25);cursor:pointer;transition:all 0.3s;
}
.h-dot.active{background:var(--blue);transform:scale(1.4)}

/* CTAs — sit at the bottom */
.h-ctas{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  z-index:10;display:flex;gap:12px;white-space:nowrap;
  transition:bottom 0.45s cubic-bezier(0.77,0,0.18,1), opacity 0.3s, transform 0.3s;
}
.gallery-open .h-ctas{
  bottom:210px;
}
.h-ctas.hidden{opacity:0;pointer-events:none;}

/* Gallery panel — HIDDEN by default, SLIDES UP from bottom when car is clicked */
.gallery-panel{
  position:absolute;left:0;right:0;bottom:0;z-index:7;
  background:rgba(238,243,247,0.97);backdrop-filter:blur(12px);
  height:190px;
  padding:12px 24px 14px;
  border-top:1.5px solid rgba(122,155,176,0.15);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transform:translateY(100%);
  transition:transform 0.45s cubic-bezier(0.77,0,0.18,1);
}
.gallery-panel.open{
  transform:translateY(0);
}
.gp-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;flex-shrink:0;
}
.gp-label{
  font-size:9px;font-weight:700;letter-spacing:0.28em;
  text-transform:uppercase;color:var(--text-muted);
}
.gp-close{
  background:none;border:none;font-size:20px;
  cursor:pointer;color:var(--text-muted);line-height:1;transition:color 0.2s;
  padding:0 2px;
}
.gp-close:hover{color:var(--text)}
.gp-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  flex:1;
  overflow:hidden;
}
.gp-thumb{
  border-radius:10px;overflow:hidden;
  cursor:pointer;background:var(--bg2);
  transition:transform 0.22s,box-shadow 0.22s;
  aspect-ratio:4/3;
  width:100%;
  height:100%;
}
.gp-thumb:hover{transform:scale(1.04);box-shadow:0 6px 20px rgba(26,77,107,0.22)}
.gp-thumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px;}

/* ═══════════════════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════════════════ */
.btn-fill{
  padding:10px 32px;background:var(--blue-deep);color:#fff;
  border:none;border-radius:50px;
  font-family:'Barlow',sans-serif;font-weight:700;font-size:12px;
  letter-spacing:0.09em;text-transform:uppercase;cursor:pointer;
  transition:background 0.2s,transform 0.2s,box-shadow 0.2s;
  box-shadow:0 4px 18px rgba(26,77,107,0.28);
}
.btn-fill:hover{background:var(--blue);transform:translateY(-2px);box-shadow:0 8px 24px rgba(91,155,191,0.4)}
.btn-fill:active{transform:translateY(0)}
.btn-outline{
  padding:10px 32px;background:transparent;color:var(--text);
  border:1.5px solid rgba(26,77,107,0.25);border-radius:50px;
  font-family:'Barlow',sans-serif;font-weight:700;font-size:12px;
  letter-spacing:0.09em;text-transform:uppercase;cursor:pointer;
  transition:all 0.2s;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn-outline:hover{border-color:var(--blue);background:rgba(91,155,191,0.08);transform:translateY(-2px)}

/* ═══════════════════════════════════════════════════════════
   ABOUT SECTION
═══════════════════════════════════════════════════════════ */
.about-section{
  background:var(--blue-deep);color:#fff;
  padding:64px 80px;
  position:relative;overflow:visible;
}
.about-section::before{
  content:'';position:absolute;
  right:-120px;top:-120px;
  width:400px;height:400px;
  border-radius:50%;
  background:rgba(91,155,191,0.08);
  pointer-events:none;
}
.about-inner{max-width:960px;margin:0 auto;position:relative;z-index:1}
.section-tag{
  font-size:10px;font-weight:700;letter-spacing:0.32em;
  text-transform:uppercase;color:var(--blue-light);margin-bottom:10px;
}
.section-heading{
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(28px,4.5vw,52px);font-weight:900;
  font-style:italic;color:#fff;margin-bottom:16px;line-height:1.1;
}
.about-text{font-size:15px;color:rgba(255,255,255,0.7);line-height:1.9;max-width:740px}
.about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.stat-card{
  background:rgba(255,255,255,0.07);border-radius:14px;
  padding:22px;text-align:center;
  transition:transform 0.3s,background 0.3s;
  cursor:default;
}
.stat-card:hover{transform:translateY(-4px);background:rgba(255,255,255,0.12)}
.stat-num{
  font-family:'Barlow Condensed',sans-serif;
  font-size:44px;font-weight:900;color:var(--blue-light);line-height:1;
}
.stat-label{
  font-size:11px;font-weight:700;letter-spacing:0.15em;
  text-transform:uppercase;color:rgba(255,255,255,0.6);margin-top:8px;
}

/* ═══════════════════════════════════════════════════════════
   FEATURED SECTION
═══════════════════════════════════════════════════════════ */
.featured-section{
  padding:80px;background:var(--bg);
}
.featured-inner{max-width:1200px;margin:0 auto}
.featured-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px;
}
.featured-card{
  background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 4px 16px rgba(26,77,107,0.08);
  transition:transform 0.3s,box-shadow 0.3s;
  cursor:pointer;
}
.featured-card:hover{transform:translateY(-6px);box-shadow:0 12px 32px rgba(26,77,107,0.16)}
.featured-img{width:100%;height:240px;background:var(--bg2);overflow:hidden}
.featured-img img{width:100%;height:100%;object-fit:cover}
.featured-info{padding:20px}
.featured-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:18px;font-weight:900;color:var(--text);margin-bottom:8px;
}
.featured-desc{
  font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:12px;
}
.featured-rating{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);
}
.star{color:#ffc107}

/* ═══════════════════════════════════════════════════════════
   SHOWROOM SECTION
═══════════════════════════════════════════════════════════ */
.showroom-section{
  padding:80px;background:#fff;
}
.showroom-inner{max-width:1200px;margin:0 auto}
.showroom-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px;
}
.showroom-card{
  background:var(--bg2);border-radius:16px;overflow:hidden;
  transition:transform 0.3s,box-shadow 0.3s;
  cursor:pointer;
}
.showroom-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(26,77,107,0.12)}
.showroom-img{width:100%;height:200px;background:var(--bg);overflow:hidden}
.showroom-img img{width:100%;height:100%;object-fit:contain;padding:20px}
.showroom-info{padding:16px}
.showroom-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:16px;font-weight:900;color:var(--text);margin-bottom:6px;
}
.showroom-meta{
  display:flex;gap:12px;font-size:11px;color:var(--text-muted);margin-bottom:8px;
}
.showroom-price{
  font-family:'Barlow Condensed',sans-serif;
  font-size:18px;font-weight:900;color:var(--blue-deep);
}

/* ═══════════════════════════════════════════════════════════
   REVIEWS SECTION
═══════════════════════════════════════════════════════════ */
.reviews-section{
  padding:80px;background:var(--bg);
}
.reviews-inner{max-width:1200px;margin:0 auto}
.reviews-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:32px;
}
.review-card{
  background:#fff;border-radius:16px;padding:24px;
  box-shadow:0 4px 16px rgba(26,77,107,0.08);
  transition:transform 0.3s,box-shadow 0.3s;
}
.review-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(26,77,107,0.12)}
.review-stars{
  display:flex;gap:4px;margin-bottom:12px;
}
.review-text{
  font-size:14px;color:var(--text);line-height:1.7;margin-bottom:12px;
}
.review-author{
  font-weight:700;font-size:12px;color:var(--text-muted);
}

/* ═══════════════════════════════════════════════════════════
   CONTACT SECTION
═══════════════════════════════════════════════════════════ */
.contact-section{
  padding:80px;background:#fff;
}
.contact-inner{max-width:1200px;margin:0 auto}
.contact-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:40px;margin-top:32px;
}
.contact-form{
  display:flex;flex-direction:column;gap:16px;
}
.contact-input{
  padding:12px 16px;border:1px solid rgba(26,77,107,0.2);
  border-radius:8px;font-family:'Barlow',sans-serif;
  font-size:14px;color:var(--text);background:#fff;
  transition:border-color 0.2s;
}
.contact-input:focus{
  outline:none;border-color:var(--blue);
}
.contact-info{
  display:flex;flex-direction:column;gap:24px;
}
.contact-item{
  display:flex;gap:16px;
}
.contact-icon{
  font-size:24px;color:var(--blue);flex-shrink:0;
}
.contact-text{
  display:flex;flex-direction:column;
}
.contact-label{
  font-size:12px;font-weight:700;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;
}
.contact-value{
  font-size:14px;color:var(--text);
}

/* ═══════════════════════════════════════════════════════════
   LIGHTBOX
═══════════════════════════════════════════════════════════ */
#lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,0.9);
  z-index:1000;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity 0.3s,visibility 0.3s;
}
#lightbox.open{
  opacity:1;visibility:visible;
}
#lbImg{
  max-width:90vw;max-height:90vh;object-fit:contain;
}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:none;border:none;font-size:40px;color:#fff;
  cursor:pointer;padding:20px;z-index:1001;
  transition:color 0.2s;
}
.lb-nav:hover{color:var(--blue-light)}
.lb-prev{left:20px}
.lb-next{right:20px}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════════ */
@media(max-width:768px){
  .featured-grid,.showroom-grid,.reviews-grid{
    grid-template-columns:1fr;
  }
  .about-section,.featured-section,.showroom-section,.reviews-section,.contact-section{
    padding:40px 20px;
  }
  .contact-grid{
    grid-template-columns:1fr;
  }
  .hero-car-box{
    padding:60px 40px 100px;
  }
  .gallery-open .hero-car-box{
    padding-bottom:240px;
  }
  .h-dots{bottom:40px}
  .gallery-open .h-dots{bottom:210px}
  .h-ctas{bottom:12px}
  .gallery-open .h-ctas{bottom:170px}
}

@media(max-width:480px){
  .featured-grid,.showroom-grid,.reviews-grid{
    grid-template-columns:1fr;
  }
  .about-section,.featured-section,.showroom-section,.reviews-section,.contact-section{
    padding:32px 16px;
  }
  .hero-car-box{
    padding:50px 30px 80px;
  }
  .gallery-open .hero-car-box{
    padding-bottom:200px;
  }
  .h-dots{bottom:35px}
  .gallery-open .h-dots{bottom:190px}
  .h-ctas{bottom:10px;gap:8px}
  .gallery-open .h-ctas{bottom:150px}
  .btn-fill,.btn-outline{
    padding:9px 24px;font-size:11px;
  }
}

/* ═══════════════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════════════ */
.reveal{opacity:0;transform:translateY(20px);transition:opacity 0.6s,transform 0.6s}
.reveal.visible{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<!-- NAV -->
<nav style="position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:#fff;border-bottom:1px solid rgba(26,77,107,0.1);z-index:100;display:flex;align-items:center;padding:0 40px;gap:40px">
  <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--text)">Speed Bun</div>
  <div style="flex:1;display:flex;gap:32px;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted)">
    <a href="#" style="text-decoration:none;color:inherit;transition:color 0.2s" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--text-muted)'">Home</a>
    <a href="#" style="text-decoration:none;color:inherit;transition:color 0.2s" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--text-muted)'">Showroom</a>
    <a href="#" style="text-decoration:none;color:inherit;transition:color 0.2s" onmouseover="this.style.color='var(--blue)'" onmouseout="this.style.color='var(--text-muted)'">Contact</a>
  </div>
  <div style="width:32px;height:32px;border-radius:50%;background:var(--blue);cursor:pointer"></div>
</nav>

<!-- HERO -->
<div class="home-hero" id="homeHero">
  <div class="hero-stage" id="heroStage"></div>
  <button class="h-arrow h-prev" onclick="heroGo(-1)">‹</button>
  <button class="h-arrow h-next" onclick="heroGo(1)">›</button>
  <div class="h-dots" id="heroDots"></div>
  <div class="h-ctas" id="heroCtas">
    <button class="btn-fill" onclick="alert('View Showroom')">View Showroom</button>
    <button class="btn-outline" onclick="alert('Details')">Details</button>
  </div>
  <div class="gallery-panel" id="galleryPanel">
    <div class="gp-header">
      <div class="gp-label">Take a Look</div>
      <button class="gp-close" onclick="closeGallery()">✕</button>
    </div>
    <div class="gp-row" id="gpRow"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <img id="lbImg" src="" alt="">
  <button class="lb-nav lb-prev" onclick="lbGo(-1)">‹</button>
  <button class="lb-nav lb-next" onclick="lbGo(1)">›</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════
const cars = [
  {
    id: 1,
    make: 'MG',
    model: 'MG5 SALOON',
    name: 'MG MG5 Saloon',
    year: '2022',
    miles: '18,400 mi',
    price: '£14,995',
    fuel: 'Electric',
    trans: 'Automatic',
    color: 'Battersea Blue',
    accentColor: '#4a9fd8',
    range: '260',
    seats: '5',
    hp: '156',
    heroImg: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
    imgs: []
  },
  {
    id: 2,
    make: 'Kia',
    model: 'EV9',
    name: 'Kia EV9',
    year: '2023',
    miles: '5,200 mi',
    price: '£32,500',
    fuel: 'Electric',
    trans: 'Automatic',
    color: 'Pearl White',
    accentColor: '#c41e3a',
    range: '304',
    seats: '7',
    hp: '210',
    heroImg: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
    imgs: []
  },
  {
    id: 3,
    make: 'Tesla',
    model: 'Model 3',
    name: 'Tesla Model 3',
    year: '2023',
    miles: '8,900 mi',
    price: '£38,990',
    fuel: 'Electric',
    trans: 'Automatic',
    color: 'Solid Black',
    accentColor: '#e82127',
    range: '358',
    seats: '5',
    hp: '272',
    heroImg: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
    imgs: []
  }
];

let hi = 0, galOpen = false, isAnimating = false, lbImgs = [], lbIdx = 0;

// ═══════════════════════════════════════════════════════════
// BUILD HERO
// ═══════════════════════════════════════════════════════════
function buildHero() {
  const stage = document.getElementById('heroStage');
  const dots = document.getElementById('heroDots');
  stage.innerHTML = '';
  dots.innerHTML = '';
  
  cars.forEach((c, i) => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' current' : '');
    slide.id = 'hslide-' + i;
    slide.innerHTML = `
      <div class="hero-text-block">
        <div class="hero-make"><div class="hero-make-inner" id="hmake-${i}">${c.make}</div></div>
        <div class="hero-bg-text"><div class="hero-bg-text-inner" id="hbgt-${i}">${c.model}</div></div>
      </div>
      <div class="hero-car-box">
        <img class="hero-car" src="${c.heroImg}" alt="${c.name}" id="hcar-${i}"
             onclick="toggleGallery(${c.id})" title="Click to see more photos">
      </div>
      <div class="hero-specs">
        <div class="specs-title">Specs</div>
        <div class="spec-item">
          <div class="spec-num">${c.range} <span class="spec-unit">mi</span></div>
          <div class="spec-lbl">Range</div>
        </div>
        <div class="spec-item">
          <div class="spec-num">${c.seats}</div>
          <div class="spec-lbl">Seats</div>
        </div>
        <div class="spec-item">
          <div class="spec-num">${c.hp}</div>
          <div class="spec-lbl">HP</div>
        </div>
      </div>`;
    stage.appendChild(slide);

    const d = document.createElement('div');
    d.className = 'h-dot' + (i === 0 ? ' active' : '');
    d.onclick = () => heroSet(i);
    dots.appendChild(d);
  });
}

// ═══════════════════════════════════════════════════════════
// HERO TRANSITION
// ═══════════════════════════════════════════════════════════
function heroSet(newIdx, dir) {
  if (isAnimating || newIdx === hi) return;
  isAnimating = true;
  const direction = dir !== undefined ? dir : (newIdx > hi ? 1 : -1);

  const oldSlide = document.getElementById('hslide-' + hi);
  const newSlide = document.getElementById('hslide-' + newIdx);
  const oldCar = document.getElementById('hcar-' + hi);
  const newCar = document.getElementById('hcar-' + newIdx);
  const oldBgt = document.getElementById('hbgt-' + hi);
  const newBgt = document.getElementById('hbgt-' + newIdx);
  const oldMake = document.getElementById('hmake-' + hi);
  const newMake = document.getElementById('hmake-' + newIdx);

  oldBgt.classList.remove('enter-down');
  oldBgt.classList.add('exit-up');
  oldMake.classList.remove('enter-down');
  oldMake.classList.add('exit-up');
  oldCar.classList.add(direction > 0 ? 'slide-out-left' : 'slide-out-right');

  newSlide.classList.add('current');
  newSlide.style.opacity = '1';
  newSlide.style.pointerEvents = 'auto';

  newBgt.classList.remove('exit-up', 'enter-down');
  newMake.classList.remove('exit-up', 'enter-down');
  void newBgt.offsetWidth;
  void newMake.offsetWidth;

  newBgt.classList.add('enter-down');
  newMake.classList.add('enter-down');

  newCar.classList.remove('slide-in-right', 'slide-in-left');
  void newCar.offsetWidth;
  newCar.classList.add(direction > 0 ? 'slide-in-right' : 'slide-in-left');

  document.querySelectorAll('.h-dot').forEach((d, j) => d.classList.toggle('active', j === newIdx));

  if (galOpen) {
    const panel = document.getElementById('galleryPanel');
    const hero = document.getElementById('homeHero');
    const oldSpecs = document.getElementById('hslide-' + hi)?.querySelector('.hero-specs');
    panel.classList.remove('open');
    hero.classList.remove('gallery-open');
    if (oldSpecs) oldSpecs.classList.remove('open');
    galOpen = false;
  }

  setTimeout(() => {
    oldSlide.classList.remove('current');
    oldSlide.style.opacity = '';
    oldSlide.style.pointerEvents = '';
    oldCar.classList.remove('slide-out-left', 'slide-out-right');
    oldBgt.classList.remove('exit-up');
    oldMake.classList.remove('exit-up');
    hi = newIdx;
    isAnimating = false;
  }, 550);
}

function heroGo(d) {
  const newIdx = (hi + d + cars.length) % cars.length;
  heroSet(newIdx, d);
}

// ═══════════════════════════════════════════════════════════
// GALLERY & SPECS
// ═══════════════════════════════════════════════════════════
function updateGallery(c) {
  if (!c || !c.imgs || !c.imgs.length) return;
  document.getElementById('gpRow').innerHTML = c.imgs.map((img, idx) => `
    <div class="gp-thumb" onclick="openLightbox(${c.id},${idx})">
      <img src="${img}" loading="lazy" alt="${c.name} photo ${idx + 1}">
    </div>`).join('');
}

function showSpecs(slideIdx) {
  const slide = document.getElementById('hslide-' + slideIdx);
  if (!slide) return;
  const title = slide.querySelector('.specs-title');
  const items = slide.querySelectorAll('.spec-item');
  if (title) setTimeout(() => title.classList.add('visible'), 80);
  items.forEach((item, i) => {
    setTimeout(() => item.classList.add('visible'), 180 + i * 120);
  });
}

function hideSpecs(slideIdx) {
  const slide = document.getElementById('hslide-' + slideIdx);
  if (!slide) return;
  const title = slide.querySelector('.specs-title');
  const items = slide.querySelectorAll('.spec-item');
  if (title) title.classList.remove('visible');
  items.forEach(item => item.classList.remove('visible'));
}

function getCurrentSpecsPanel() {
  const slide = document.getElementById('hslide-' + hi);
  return slide ? slide.querySelector('.hero-specs') : null;
}

function toggleGallery(id) {
  const panel = document.getElementById('galleryPanel');
  const hero = document.getElementById('homeHero');
  const c = cars.find(x => x.id === id);
  const specs = getCurrentSpecsPanel();

  if (galOpen) {
    panel.classList.remove('open');
    hero.classList.remove('gallery-open');
    if (specs) specs.classList.remove('open');
    hideSpecs(hi);
    galOpen = false;
  } else {
    if (c) updateGallery(c);
    panel.classList.add('open');
    hero.classList.add('gallery-open');
    if (specs) specs.classList.add('open');
    showSpecs(hi);
    galOpen = true;
  }
}

function closeGallery() {
  const panel = document.getElementById('galleryPanel');
  const hero = document.getElementById('homeHero');
  const specs = getCurrentSpecsPanel();
  panel.classList.remove('open');
  hero.classList.remove('gallery-open');
  if (specs) specs.classList.remove('open');
  hideSpecs(hi);
  galOpen = false;
}

// ═══════════════════════════════════════════════════════════
// LIGHTBOX
// ═══════════════════════════════════════════════════════════
function openLightbox(carId, idx) {
  const c = cars.find(x => x.id === carId);
  lbImgs = c.imgs; lbIdx = idx;
  document.getElementById('lbImg').src = lbImgs[lbIdx];
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function lbGo(d) {
  lbIdx = (lbIdx + d + lbImgs.length) % lbImgs.length;
  document.getElementById('lbImg').src = lbImgs[lbIdx];
}

document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
buildHero();
</script>

</body>
</html>
